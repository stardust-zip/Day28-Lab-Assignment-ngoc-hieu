[project]
name = "lab28-ai-platform"
version = "0.1.0"
description = "Full Platform Integration Sprint"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # ── API Gateway Dependencies ──
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "langsmith",

    # ── Data Pipeline & Prefect Dependencies ──
    "prefect==2.14.0",
		"griffe<1.0.0",
    "kafka-python==2.0.2",
    "pandas==2.1.0",
    "pyarrow==14.0.0",
		"numpy<2.0.0",

    # ── Integration Services ──
    "qdrant-client",
    "redis",

    # ── Testing & Observability ──
    "pytest",
    "requests"
]

[tool.uv]
package = false
